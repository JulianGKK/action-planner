gradle.beforeProject { p ->
    p.plugins.withId('com.android.application') {
        if(p.path==':app')p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
            dsl.defaultConfig.applicationId='org.pag.perf.p11probe'
            dsl.defaultConfig.testApplicationId='org.pag.perf.p11probe.test'
            dsl.defaultConfig.manifestPlaceholders.put('pagTestTargetPackage','org.pag.perf.p11probe')
        }
    }
    p.plugins.withId('com.android.library') {
        if(p.path==':data')p.extensions.getByName('android').defaultConfig.testApplicationId='org.pag.data.unlockprobe'
    }
}
