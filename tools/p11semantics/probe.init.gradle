// Explicit isolated probe only. No changes to normal product sources/manifest/dependencies.
gradle.beforeProject { p ->
    p.plugins.withId('com.android.application') {
        if(p.path==':app') {
            p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                dsl.defaultConfig.applicationId='org.pag.test.p11semantics'
                dsl.defaultConfig.testApplicationId='org.pag.test.p11semantics.test'
                dsl.defaultConfig.testInstrumentationRunner='org.pag.semantics.SemanticsProbe'
                dsl.defaultConfig.manifestPlaceholders.put('pagTestTargetPackage','org.pag.test.p11semantics')
            }
            def a=p.extensions.getByName('android')
            a.sourceSets.getByName('debug').kotlin.srcDir(new File(p.rootDir,'tools/p11semantics/target'))
            a.sourceSets.getByName('debug').manifest.srcFile(new File(p.rootDir,'tools/p11semantics/TargetManifest.xml'))
            a.sourceSets.getByName('androidTest').kotlin.srcDir(new File(p.rootDir,'tools/p11semantics/android'))
            a.sourceSets.getByName('androidTest').manifest.srcFile(new File(p.rootDir,'tools/p11semantics/TestManifest.xml'))
        }
    }
}
